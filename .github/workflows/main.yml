name: Build Nova Debug v2
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - name: Build
        working-directory: nova-debug-v2
        run: gradle build
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nova-debug-v2-jar
          path: nova-debug-v2/build/libs/*.jar
